<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" type="text/CSS" href="style.css">
        <link href="https://fonts.googleapis.com/css2?family=Revalia&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Revalia&family=Roboto&display=swap" rel="stylesheet">
        <title>Онлайн-школа программирования для детей</title>
        <script src="jquery-3.5.1.min.js"></script>
    </head>

    <body>

        <header>
            <div class="wrapper">
                <div class="header_wrapper">
                    <div class="header_logo">
                        <h1 id="headerLogo">Coder Kids</h1>
                    </div>

                    <div class="header_menu">
                        <a href="index.html" class="menu_item" >ГЛАВНАЯ</a>
                        <a href="index2.html" class="menu_item">ЗАПИСАТЬСЯ НА ЗАНЯТИЯ</a>
                        <a href="#footer" class="menu_item">КОНТАКТЫ</a>
                    </div>
                </div>
            </div>
        </header>

        <main>

            <section class="send">
                <div class="wrapper">
                    <div class="send_wrapper">
                        <h1 class="send_title">
                            Хочешь научиться программировать?
                        </h1>
                        <p class="send_text">
                            Запишитесь на курс и начинайте учить программирование уже сегодня! Мы поможем вам шаг за шагом освоить все необходимые навыки.
                        </p>
                        <form>
                            <div class="send_form">
                                <div>
                                    <input type="text" class="form1 formstyle" placeholder="Ваше имя">
                                    <input type="email" class="form2 formstyle" placeholder="Ваш e-mail">
                                </div>
                                <textarea cols="30" rows="10" class="form3 formstyle" placeholder="Сообщение"></textarea>
                                <button class="send_button">ОТПРАВИТЬ</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

        </main>

        <footer id="footer">
            <div class="wrapper">
                <div class="footer_wrapper">
                    <div class="left_footer">
                        <h3 class="footer_title">Coder Kids</h3>
                        <p class="footer_text">(с) 2025. Все права защищены.</p>
                    </div>
                    <div class="right_footer">
                        <img src="vk-logo.png" alt="VK" class="footer_img">
                        <img src="vk-logo.png" alt="VK" class="footer_img">
                        <img src="vk-logo.png" alt="VK" class="footer_img">
                    </div>
                </div>
            </div>
        </footer>

        <link rel="stylesheet" href="lightzoom/style.css">
        <script src="lightzoom/lightzoom.js"></script>

        <script>jQuery('.lightzoom').lightzoom({speed: 400, viewTitle: true, isOverlayClickClosing: true});</script>
        <script src="myscript.js"></script>
    </body>

</html>
